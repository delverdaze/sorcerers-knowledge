# コミュニティFAQの収録案フォーム。
#
# **`label:` は 2 つの構文解析との契約** — 起票された本文は `### <label>` の見出しと値で組まれ、
# sorcerers-knowledge の scripts/faq-proposal.mjs と sorcerers-den の
# functions/admin/api/issue.js が同じ対応表でこれを読む。
# label は「日本語 / English」（区切りは半角スペース＋ / ＋半角スペース）の形にし、
# 照合は ` / ` より前の**日本語側**で行う（日本語だけだった頃の Issue も読める）。
# したがって ` / ` の後ろ（英語側）は自由に直せるが、**日本語側を変えるときは
# 上の 2 つの対応表も同時に直すこと**（知らない見出しは捨てずに extra に残るので、
# 直し忘れても値そのものは失われない）。
name: ZZTEST-D-no-markdown
description: カード別FAQに「コミュニティ」として収録したい Q&A の案。7日ほどを目処にレビューを募り、異論がなければソーサラーズ・デン（ソサデン）がサイトに載せます / A Q&A you would like recorded as a community FAQ on a card page. Review is requested for about 7 days; if there are no objections Sorcerers' Den records it
title: "[FAQ案] "
labels: [faq-proposal, needs-review]
body:
  - type: input
    id: card
    attributes:
      label: カード名 / Card
      description: 英語名・日本語名どちらでも / English or Japanese name
      placeholder: "Wuthering Heights / 嵐が丘"
    validations:
      required: true
  - type: textarea
    id: q-en
    attributes:
      label: 質問（英語） / Question (EN)
  - type: textarea
    id: a-en
    attributes:
      label: 回答（英語） / Answer (EN)
  - type: textarea
    id: q-ja
    attributes:
      label: 質問（日本語） / Question (JA)
  - type: textarea
    id: a-ja
    attributes:
      label: 回答（日本語） / Answer (JA)
  - type: textarea
    id: basis
    attributes:
      label: 根拠 / Basis
      description: 公式FAQ・Judge FAQ・Codex の該当箇所、または議論のリンク（掲示板のスレッド・X など） / The relevant part of the official FAQ, Judge FAQ or Codex, or a link to the discussion (a board thread, X, and so on)
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 元となった議論・投稿の日付 / Date of the original discussion
      placeholder: "2026-09-13"
  - type: input
    id: credit
    attributes:
      label: クレジット表記（任意） / Attribution (optional)
      description: >-
        サーバー単位で（例「○○ Discord #rules-questions の議論を基に再構成」）。個人名は本人が希望した場合のみ /
        Name the server, not the person (for example "Reconstructed from a discussion in ○○ Discord #rules-questions").
        An individual's name only if they ask for it
  - type: textarea
    id: focus
    attributes:
      label: 特に見てほしい点 / What to look at
      description: 迷っている箇所・自信のない訳語など。レビューする人はここから読みます / Where you are unsure — wording, a translation you are not confident about. Reviewers start here
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認 / Confirmation
      options:
        - label: 元の投稿を引用せず再構成した／投稿者の名前を出していない / I wrote it in my own words and did not name the people who posted
          required: true
        - label: 公式FAQ・Judge FAQ と矛盾しないことを確認した / I checked that it does not contradict the official FAQ or the Judge FAQ
