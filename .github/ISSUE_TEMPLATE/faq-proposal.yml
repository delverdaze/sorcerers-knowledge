name: コミュニティFAQの収録案 / Community FAQ proposal
description: カード別FAQに「コミュニティ」として収録したい Q&A の案。7日ほどを目処にレビューを募り、異論がなければ管理人がサイトへ収録します
title: "[FAQ案] "
labels: [faq-proposal, needs-review]
body:
  - type: markdown
    attributes:
      value: |
        ありがとうございます！ 収録案は次の流れで進みます。
        - 起票から **7日ほどを目処**に、異論が無ければ管理人が [Sorcerers' Den](https://sorcerers-den.pages.dev/) のカード頁へ収録します。締切ではありません。それ以降のご意見も歓迎で、収録後でも直します
        - 本文への 👍 は「収録に賛成」、😕 は「気になる点がある」（理由をコメントで）
        - 元の投稿を**そのまま貼らず、再構成した文**で書いてください。Discord 等の投稿者名・スクリーンショットも不可（本人が希望した場合だけクレジット）
        - 収録されても**非公式**です。公式裁定・英語原文が優先します
        - 英語・日本語はどちらか一方でも構いません（片方は管理人が訳します）
  - type: input
    id: card
    attributes:
      label: カード名
      description: 英語名・日本語名どちらでも
      placeholder: "Wuthering Heights / 嵐が丘"
    validations:
      required: true
  - type: textarea
    id: q-en
    attributes:
      label: 質問（英語）
  - type: textarea
    id: a-en
    attributes:
      label: 回答（英語）
  - type: textarea
    id: q-ja
    attributes:
      label: 質問（日本語）
  - type: textarea
    id: a-ja
    attributes:
      label: 回答（日本語）
  - type: textarea
    id: basis
    attributes:
      label: 根拠
      description: 公式FAQ・Judge FAQ・Codex の該当箇所、または議論のリンク（掲示板のスレッド・X など）
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 元となった議論・投稿の日付
      placeholder: "2026-09-13"
  - type: input
    id: credit
    attributes:
      label: クレジット表記（任意）
      description: サーバー単位で（例「○○ Discord #rules-questions の議論を基に再構成」）。個人名は本人が希望した場合のみ
  - type: textarea
    id: focus
    attributes:
      label: 特に見てほしい点
      description: 迷っている箇所・自信のない訳語など。レビューする人はここから読みます
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 元の投稿を引用せず再構成した／投稿者の名前を出していない
          required: true
        - label: 公式FAQ・Judge FAQ と矛盾しないことを確認した
